name: Publish expanded Eurodrone English MP4
on:
  workflow_run:
    workflows:
      - "Eurodrone English — complete Check and extended Translate"
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: "Completed English Eurodrone workflow run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download the verified expanded Translate tutorial
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run || github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$TARGET_RUN" --repo "$REPO" --name ASRI-Eurodrone-Expanded-Translate-English --dir release-assets
          test -s release-assets/ASRI_Eurodrone_Tutorial_English.mp4
          test -s release-assets/tutorial-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('release-assets/tutorial-report.json').read_text())
          assert report['status']=='succeeded',report
          assert report.get('strategic_translation_cues',0)>=41,report
          assert report.get('translate_in_depth_conclusions')==7,report
          print('Verified real MP4, 41 Translate cues and seven extended conclusions')
          PY
          mv release-assets/ASRI_Eurodrone_Tutorial_English.mp4 release-assets/ASRI_Eurodrone_Translate_English_2026.mp4
      - name: Publish directly downloadable MP4 (not an Actions ZIP)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="asri-eurodrone-translate-2026-11-12"
          VIDEO="release-assets/ASRI_Eurodrone_Translate_English_2026.mp4"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VIDEO" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "$VIDEO" --repo "$REPO" --latest=false \
              --title "ASRI Eurodrone — Complete Translate English tutorial" \
              --notes "Recorded tutorial of the current ASRI app: complete Eurodrone example, simulated evidence checks, seven detailed strategic conclusions and four audiences. British voice and subtitles. Illustrative exercise; not approved operational data."
          fi
          gh release view "$TAG" --repo "$REPO" --json url,assets
