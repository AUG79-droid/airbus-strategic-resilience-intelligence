name: Publish expanded Eurodrone English MP4
on:
  workflow_run:
    workflows:
      - "Eurodrone English — complete Check and extended Translate"
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: "Completed English Eurodrone workflow run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download the verified expanded Translate tutorial
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run || github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$TARGET_RUN" --repo "$REPO" --name ASRI-Eurodrone-Expanded-Translate-English --dir release-assets
          test -s release-assets/ASRI_Eurodrone_Tutorial_English.mp4
          test -s release-assets/tutorial-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('release-assets/tutorial-report.json').read_text())
          assert report['status']=='succeeded',report
          assert report.get('strategic_translation_cues',0)>=41,report
          assert report.get('translate_in_depth_conclusions')==7,report
          print('Verified real MP4, 41 Translate cues and seven extended conclusions')
          PY
          mv release-assets/ASRI_Eurodrone_Tutorial_English.mp4 release-assets/ASRI_2_0_Eurodrone_English_Tutorial.mp4
          test -s release-assets/subtitles.srt
      - name: Publish directly downloadable MP4 (not an Actions ZIP)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="asri-v2-eurodrone-english-2026-11-14"
          VIDEO="release-assets/ASRI_2_0_Eurodrone_English_Tutorial.mp4"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VIDEO" release-assets/subtitles.srt release-assets/tutorial-report.json --repo "$REPO" --clobber
          else
            gh release create "$TAG" "$VIDEO" release-assets/subtitles.srt release-assets/tutorial-report.json --repo "$REPO" --latest=false \
              --title "ASRI 2.0 — Eurodrone English video tutorial" \
              --notes "New recording of the published ASRI 2.0 application: Eurodrone hypothetical case, conditional risks, environmental comparability, supply-route dependencies, simulated evidence checks and a detailed Translate chapter for four audiences. Calm British en_GB-alba-medium narration; discrete two-line subtitle band. MP4 and editable SRT provided. Illustrative exercise only; not approved Airbus operational data."
          fi
          gh release view "$TAG" --repo "$REPO" --json url,assets
