name: ASRI tutorial en castellano de España

on:
  workflow_dispatch:
  push:
    paths:
      - "video-demo/tutorial-es/TRIGGER_ONCE.txt"

permissions:
  contents: read

concurrency:
  group: asri-spanish-tutorial
  cancel-in-progress: false

jobs:
  tutorial:
    name: Grabar y narrar las cuatro etapas en castellano
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout independent tutorial tools and unchanged web app
        uses: actions/checkout@v4

      - name: Node for browser automation
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Python for offline British voice
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Spanish script and recorder syntax before using runner resources
        run: |
          python -m py_compile video-demo/tutorial-es/narrate.py video-demo/tutorial-es/assemble.py
          node --check video-demo/tutorial-es/record.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('video-demo/tutorial-es/chapters.json').read_text(encoding='utf-8'))
          assert doc['language'] == 'es-ES'
          assert len(doc['chapters']) == 7
          cues = [x for chapter in doc['chapters'] for x in chapter['cues']]
          assert len(cues) == 82
          assert all(x['text'].strip() for x in cues)
          assert len(set(x['id'] for x in cues)) == len(cues)
          print('82 Castilian Spanish narration cues confirmed')
          PY

      - name: Install independent browser controller
        run: npm install --prefix video-demo --no-fund --no-audit --ignore-scripts

      - name: Install disposable Chromium
        run: node video-demo/node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Install free offline Castilian Spanish narrator
        run: python -m pip install --disable-pip-version-check piper-tts==1.3.0

      - name: Install local HD video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe
          command -v piper

      - name: Generate 7-chapter ES-ES script, voice, subtitles and timeline
        run: python video-demo/tutorial-es/narrate.py

      - name: Record the actual Spanish-language application through all four stages
        run: node video-demo/tutorial-es/record.mjs

      - name: Produce synchronized Spanish-language MP4 with subtitles below interface
        run: python video-demo/tutorial-es/assemble.py

      - name: Upload complete video and QA report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASRI-Tutorial-Completo-Castellano
          path: |
            video-demo/tutorial-es/output/ASRI_Tutorial_Completo_Castellano_ES.mp4
            video-demo/tutorial-es/output/tutorial-report.json
            video-demo/tutorial-es/output/recording-timing.json
            video-demo/tutorial-es/output/timeline.json
            video-demo/tutorial-es/output/subtitles.srt
            video-demo/tutorial-es/output/voice-credits.txt
            video-demo/tutorial-es/output/tutorial-start.png
            video-demo/tutorial-es/output/result-90-percent.png
            video-demo/tutorial-es/output/example-decision-report.pdf
            video-demo/tutorial-es/output/example-decision-data.json
          if-no-files-found: warn
          retention-days: 7
