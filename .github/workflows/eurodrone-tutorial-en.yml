name: Eurodrone final revised — English (Translate emphasis)
on:
  workflow_dispatch:
  push:
    paths:
      - video-demo/eurodrone/TRIGGER_EN.txt

permissions:
  contents: read

concurrency:
  group: eurodrone-english-video
  cancel-in-progress: false

jobs:
  tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate script before recording
        run: |
          python -m py_compile video-demo/eurodrone/build_audio.py video-demo/eurodrone/render_video.py
          node --check video-demo/eurodrone/record.mjs
          python - <<'PY'
          import json,textwrap
          d=json.load(open('video-demo/eurodrone/en/chapters.json'))
          assert d['language']=='en-GB' and len(d['chapters'])==7
          cues=[cue for ch in d['chapters'] for cue in ch['cues']]
          assert len(cues)==70 and len({cue['id'] for cue in cues})==70
          for c in cues:
              assert len(textwrap.wrap(c['text'],width=78,break_long_words=False,break_on_hyphens=False))<=2,(c['id'],c['text'])
          print('English Eurodrone storyboard validated:',len(cues),'timed cues')
          PY
      - name: Install original offline British voice and video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check piper-tts==1.3.0
      - name: Install Playwright recorder
        run: |
          npm install --prefix video-demo --no-fund --no-audit --ignore-scripts
          node video-demo/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Generate narration with identical en_GB-alba-medium voice
        run: python video-demo/eurodrone/build_audio.py en
      - name: Record actual Eurodrone case, calculations, checks and exports
        run: node video-demo/eurodrone/record.mjs en
      - name: Encode synchronized Full HD British English video
        run: python video-demo/eurodrone/render_video.py en
      - name: Deliver English MP4, subtitles and quality report
        uses: actions/upload-artifact@v4
        with:
          name: ASRI-Eurodrone-Final-Revised-English
          path: |
            video-demo/eurodrone/en/output/ASRI_Eurodrone_Tutorial_English.mp4
            video-demo/eurodrone/en/output/tutorial-report.json
            video-demo/eurodrone/en/output/subtitles.srt
            video-demo/eurodrone/en/output/voice-credits.txt
            video-demo/eurodrone/en/output/recording-timing.json
            video-demo/eurodrone/en/output/edited-recovery.png
            video-demo/eurodrone/en/output/eurodrone-report.pdf
            video-demo/eurodrone/en/output/eurodrone-case.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 2
