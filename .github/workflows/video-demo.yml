name: Generate ASRI English video preview

on:
  workflow_dispatch:
  push:
    paths:
      - "video-demo/TRIGGER_ONCE.txt"

permissions:
  contents: read

concurrency:
  group: asri-video-preview
  cancel-in-progress: false

jobs:
  video:
    name: Record real browser and build narrated video
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read published application source without modifying it
        uses: actions/checkout@v4

      - name: Use Node.js for browser automation
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Use isolated Python for the offline voice
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install independent Playwright recorder
        run: npm install --prefix video-demo --no-fund --no-audit --ignore-scripts

      - name: Install sandboxed Chromium on this runner
        run: node video-demo/node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Install offline text-to-speech engine
        run: python -m pip install --disable-pip-version-check piper-tts==1.3.0

      - name: Verify free local video tools
        run: |
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2
          which piper

      - name: Generate English narration and subtitles
        run: python video-demo/generate_narration.py

      - name: Record live interface and verify example results
        run: node video-demo/record.mjs

      - name: Assemble final narrated Full HD MP4
        run: python video-demo/assemble.py

      - name: Publish downloadable video and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASRI-English-Video-Preview
          path: |
            video-demo/output/ASRI_English_Demo_60s.mp4
            video-demo/output/subtitles.srt
            video-demo/output/voice-credits.txt
            video-demo/output/timeline.json
            video-demo/output/video-report.json
            video-demo/output/recording-timing.json
            video-demo/output/scene-start.png
            video-demo/output/scene-change.png
          if-no-files-found: warn
          retention-days: 7
