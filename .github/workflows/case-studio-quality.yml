name: ASRI Case Studio Quality Gate
on:
  push:
    branches: [main, asri-v2-audit-remediation]
    paths:
      - 'app/**'
      - 'docs/ASRI-V2-AUDIT-TRACKER.md'
      - '.github/workflows/case-studio-quality.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: case-studio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        id: install
        working-directory: app
        run: npm ci
      - name: Run all tests
        id: tests
        working-directory: app
        run: npm test
      - name: Typecheck and production build
        id: build
        working-directory: app
        run: npm run build
      - name: Run browser journeys and export checks
        id: e2e
        working-directory: app
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN" || { echo "Chrome not available on runner"; exit 1; }
          npm run preview -- --port 4174 > /tmp/asri-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in {1..40}; do
            if curl -fsS "http://127.0.0.1:4174/airbus-strategic-resilience-intelligence/" >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then cat /tmp/asri-preview.log; exit 1; fi
          npm run test:final-qa
          npm run test:translator-ui
          npm run test:export-ui
          npm run test:lab-ui
          npm run test:evidence-ui
          npm run test:guided-ui
          npm run test:four-cases-ui
          node scripts/test-joint-risk-ui.mjs
          node scripts/test-capacity-ui.mjs
      - name: Report granular quality status on commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL: ${{ steps.install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          if [ "$INSTALL" = "success" ] && [ "$TESTS" = "success" ] && [ "$BUILD" = "success" ] && [ "$E2E" = "success" ]; then state=success; else state=failure; fi
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context="asri/case-studio-quality" \
            -f description="Install: $INSTALL; tests: $TESTS; build: $BUILD; e2e: $E2E" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
