name: ASRI revised English tutorial

on:
  workflow_dispatch:
  push:
    paths:
      - "video-demo/tutorial/TRIGGER.txt"

permissions:
  contents: read

concurrency:
  group: asri-full-tutorial
  cancel-in-progress: false

jobs:
  tutorial:
    name: Narrate and record complete four-stage tutorial
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout independent tutorial tools and unchanged web app
        uses: actions/checkout@v4

      - name: Node for browser automation
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Python for offline British voice
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install independent browser controller
        run: npm install --prefix video-demo --no-fund --no-audit --ignore-scripts

      - name: Install disposable Chromium
        run: node video-demo/node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Install free offline British narrator
        run: python -m pip install --disable-pip-version-check piper-tts==1.3.0

      - name: Install local HD video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe
          command -v piper

      - name: Generate 7-chapter script audio, exact subtitles and timeline
        run: python video-demo/tutorial/narrate.py

      - name: Record real interactions through all four app stages
        run: node video-demo/tutorial/record.mjs

      - name: Assemble narrated MP4 with captions below interface
        run: python video-demo/tutorial/assemble.py

      - name: Upload complete video and QA report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASRI-Revised-Tutorial-English
          path: |
            video-demo/tutorial/output/ASRI_Guided_Tutorial_Revised_EN.mp4
            video-demo/tutorial/output/tutorial-report.json
            video-demo/tutorial/output/recording-timing.json
            video-demo/tutorial/output/timeline.json
            video-demo/tutorial/output/subtitles.srt
            video-demo/tutorial/output/voice-credits.txt
            video-demo/tutorial/output/tutorial-start.png
            video-demo/tutorial/output/result-90-percent.png
            video-demo/tutorial/output/example-decision-report.pdf
            video-demo/tutorial/output/example-decision-data.json
          if-no-files-found: warn
          retention-days: 7
