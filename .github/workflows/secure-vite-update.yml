name: ASRI one-time secure Vite dependency refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secure-vite-update.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asri-security-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update Vite and regenerate versioned lockfile
        working-directory: app
        run: |
          npm install --save-dev --save-exact vite@8.3.8 --package-lock-only
          npm install --package-lock-only
          node -e "const p=require('./package.json'),l=require('./package-lock.json');if(p.version!==l.version||l.packages[''].version!==p.version||p.devDependencies.vite!=='8.3.8'||l.packages[''].devDependencies.vite!=='8.3.8')process.exit(1)"
      - name: Commit regenerated dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package.json app/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: upgrade Vite to patched 8.3.8 and synchronise lockfile"
            git push origin HEAD:main
          fi
